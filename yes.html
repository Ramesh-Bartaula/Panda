<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>She said YES! 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Romantic fallback gradient */
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #c94b4b 100%);
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    /* Soft dark overlay so text stays readable */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      z-index: 1;
    }

    /* ── Floating hearts ── */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .heart-particle {
      position: absolute;
      animation: floatUp linear infinite;
      opacity: 0;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) rotate(0deg);   opacity: 0.9; }
      100% { transform: translateY(-120px) rotate(360deg); opacity: 0;  }
    }

    /* ── Card ── */
    .yes-container {
      position: relative;
      z-index: 10;
      text-align: center;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 30px;
      padding: 52px 60px;
      max-width: 580px;
      width: 92%;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255,255,255,0.25);
      border: 2px solid rgba(255, 200, 220, 0.4);
      animation: appear 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes appear {
      from { transform: scale(0.5) translateY(50px); opacity: 0; }
      to   { transform: scale(1)   translateY(0);    opacity: 1; }
    }

    /* ── Rose emoji bouncing ── */
    .yes-rose {
      font-size: 4.5rem;
      display: block;
      margin-bottom: 6px;
      animation: bounce 1.1s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0)    rotate(-8deg); }
      to   { transform: translateY(-14px) rotate(8deg);  }
    }

    /* ── Title ── */
    .yes-title {
      font-family: 'Dancing Script', cursive;
      font-size: 3.2rem;
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.2;
      text-shadow: 0 2px 20px rgba(214, 51, 132, 0.9), 0 0 40px rgba(255,100,150,0.6);
    }

    /* ── GIF circle ── */
    .gif-yes {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      margin: 16px auto 22px;
      border: 4px solid #ff8fab;
      box-shadow: 0 8px 28px rgba(255, 100, 150, 0.45);
      overflow: hidden;
    }

    .gif-yes img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Message ── */
    .yes-message {
      font-size: 1.3rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.93);
      line-height: 1.75;
      margin-bottom: 26px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    }

    .yes-message .love-line {
      font-size: 1.65rem;
      color: #ffb3c6;
      font-weight: 900;
      display: block;
      margin-bottom: 6px;
      text-shadow: 0 2px 16px rgba(0,0,0,0.5);
    }

    /* ── Pulsing hearts row ── */
    .yes-hearts {
      font-size: 2.4rem;
      letter-spacing: 10px;
      display: block;
      animation: pulse 1.3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);    }
      50%       { transform: scale(1.18); }
    }

    /* ── Music button ── */
    #music-toggle {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 50;
      font-size: 1.4rem;
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid #ff8fab;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255, 100, 150, 0.3);
      transition: transform 0.2s;
    }

    #music-toggle:hover { transform: scale(1.12); }

    /* ── Responsive ── */
    @media (max-width: 500px) {
      .yes-container { padding: 36px 24px; }
      .yes-title     { font-size: 2.4rem; }
      .yes-message   { font-size: 1.1rem; }
      .yes-rose      { font-size: 3.5rem; }
    }
  </style>
</head>
<body>

  <div class="hearts-bg" id="hearts-bg"></div>

  <div class="yes-container">
    <span class="yes-rose">🌹</span>

    <h1 class="yes-title">I knew you'd say Yes 🎉</h1>

    <div class="gif-yes">
      <!-- Cute love / celebration gif -->
      <img
        src="https://media.tenor.com/tQ9E4IU8GtoAAAAj/cute-love.gif"
        onerror="this.src='https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif'"
        alt="love celebration"
      >
    </div>

    <p class="yes-message">
      <span class="love-line">I love you ❤️❤️❤️</span>
      You just made me the happiest person alive.<br>
      I promise to be your sunshine on cloudy days,<br>
      your warmth on cold nights,<br>
      and your favourite reason to smile — every single day. 🌸
    </p>

    <span class="yes-hearts">❤️ 💕 🌹 💕 ❤️</span>
  </div>

  <audio id="bg-music" loop>
    <source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg">
  </audio>
  <button id="music-toggle" onclick="toggleMusic()" title="Toggle music">🔊</button>

  <script>
    /* ── Try to load romantic rose/couple background ── */
    (function loadBg() {
      // Romantic couple with rose — from Ghibli Howl's romantic scene
      const candidates = [
        'https://www.ghibli.jp/gallery/howl013.jpg',   // Howl + Sophie romance
        'https://www.ghibli.jp/gallery/howl007.jpg',
        'https://www.ghibli.jp/gallery/howl001.jpg',
      ];

      let tried = 0;
      function tryNext() {
        if (tried >= candidates.length) return; // keep CSS gradient fallback
        const img = new Image();
        img.onload = () => {
          document.body.style.backgroundImage = `url('${candidates[tried]}')`;
          document.body.style.backgroundSize  = 'cover';
          document.body.style.backgroundPosition = 'center';
        };
        img.onerror = () => { tried++; tryNext(); };
        img.src = candidates[tried];
      }
      tryNext();
    })();

    /* ── Music autoplay ── */
    window.addEventListener('load', () => {
      const music  = document.getElementById('bg-music');
      music.volume = 0.7;
      music.muted  = false;

      music.play().catch(() => {
        const unlock = () => {
          music.play();
          document.removeEventListener('click',      unlock);
          document.removeEventListener('touchstart', unlock);
        };
        document.addEventListener('click',      unlock, { once: true });
        document.addEventListener('touchstart', unlock, { once: true });
      });
    });

    function toggleMusic() {
      const music = document.getElementById('bg-music');
      const btn   = document.getElementById('music-toggle');
      if (music.paused) { music.play(); btn.textContent = '🔊'; }
      else              { music.pause(); btn.textContent = '🔇'; }
    }

    /* ── Dense floating hearts for Yes page ── */
    (function spawnHearts() {
      const container = document.getElementById('hearts-bg');
      const emojis    = ['❤️','💕','💖','💗','💓','🌹','🌸','✨','💝','🫶','💞','🎀'];

      setInterval(() => {
        const el            = document.createElement('span');
        el.className        = 'heart-particle';
        el.textContent      = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left       = Math.random() * 100 + 'vw';
        el.style.fontSize   = (16 + Math.random() * 24) + 'px';
        const dur           = 3 + Math.random() * 5;
        el.style.animationDuration = dur + 's';
        el.style.animationDelay    = Math.random() * 1.5 + 's';
        container.appendChild(el);
        setTimeout(() => el.remove(), (dur + 2) * 1000);
      }, 350);   // more frequent on Yes page ❤️
    })();
  </script>

</body>
</html>
