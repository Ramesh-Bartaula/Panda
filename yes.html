<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>She said YES! 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --rose:      #e8436a;
      --rose-soft: #f9a8be;
      --ink:       #0d0811;
      --ink-mid:   #1c1220;
      --ink-light: #2e1f2e;
      --text-main: #f7e9ef;
      --text-sub:  #c9a8b8;
      --gold:      #e8c87d;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--ink);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Canvas ── */
    #canvas-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.68) 100%);
      pointer-events: none;
    }

    /* ── Particles ── */
    .particle-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      top: -60px;
      user-select: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: 0.8; }
      50%  { transform: translateY(50vh) rotate(200deg) scale(1.05) translateX(25px); }
      100% { transform: translateY(110vh) rotate(380deg) scale(0.8) translateX(-15px); opacity: 0; }
    }

    /* ── Page layout ── */
    .page {
      position: relative;
      z-index: 10;
    }

    /* ═══════════════════════════════════════
       SECTION 1 — HERO / PROPOSAL
    ═══════════════════════════════════════ */
    #hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px 24px;
      text-align: center;
      gap: 0;
    }

    .hero-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 480px;
    }

    .proposal-label {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.85;
    }

    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.6rem, 8vw, 4.8rem);
      font-style: italic;
      line-height: 1.15;
      color: var(--text-main);
      animation: fadeUp 1s 0.2s ease both;
    }
    .hero-title span { color: var(--rose-soft); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* GIF frame */
    .gif-frame {
      width: 160px; height: 160px;
      border-radius: 50%;
      border: 2.5px solid rgba(232,67,106,0.5);
      box-shadow:
        0 0 0 6px rgba(232,67,106,0.08),
        0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
      animation: fadeUp 1s 0.4s ease both, breathe 4s 1.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 6px rgba(232,67,106,0.08), 0 20px 60px rgba(0,0,0,0.5); }
      50%      { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(232,67,106,0.14), 0 24px 70px rgba(0,0,0,0.55); }
    }
    .gif-frame img { width: 100%; height: 100%; object-fit: cover; }

    /* YES / NO buttons */
    .choice-row {
      display: flex;
      gap: 16px;
      animation: fadeUp 1s 0.6s ease both;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-yes {
      padding: 15px 44px;
      background: linear-gradient(135deg, #c42d54, var(--rose) 60%, #f06882);
      border: none;
      border-radius: 50px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(232,67,106,0.4);
      transition: transform 0.22s, box-shadow 0.22s;
    }
    .btn-yes:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 14px 40px rgba(232,67,106,0.55);
    }

    .btn-no {
      padding: 15px 44px;
      background: transparent;
      border: 1.5px solid rgba(201,168,184,0.35);
      border-radius: 50px;
      color: var(--text-sub);
      font-family: 'DM Sans', sans-serif;
      font-size: 1.05rem;
      cursor: pointer;
      transition: transform 0.18s, border-color 0.18s, color 0.18s;
      position: relative;
    }
    .btn-no:hover { color: var(--text-main); border-color: var(--rose-soft); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30,10,30,0.92);
      border: 1px solid rgba(232,67,106,0.4);
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 0.9rem;
      color: var(--rose-soft);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100;
      text-align: center;
      max-width: 280px;
      backdrop-filter: blur(12px);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Scroll cue ── */
    .scroll-cue {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--text-sub);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: fadeUp 1s 1.5s ease both;
      cursor: pointer;
      z-index: 10;
      text-decoration: none;
    }
    .scroll-arrow {
      width: 20px; height: 20px;
      border-right: 1.5px solid var(--rose-soft);
      border-bottom: 1.5px solid var(--rose-soft);
      transform: rotate(45deg);
      animation: arrowBounce 1.8s ease-in-out infinite;
      opacity: 0.6;
    }
    @keyframes arrowBounce {
      0%,100% { transform: rotate(45deg) translateY(0); }
      50%      { transform: rotate(45deg) translateY(6px); }
    }

    /* ═══════════════════════════════════════
       YES REVEAL
    ═══════════════════════════════════════ */
    #yes-reveal {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 40px 24px;
      text-align: center;
      animation: fadeUp 0.7s ease both;
    }

    .yes-big {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-style: italic;
      color: var(--text-main);
    }
    .yes-big span { color: var(--rose-soft); }
    .yes-body {
      font-size: 1.05rem;
      color: var(--text-sub);
      line-height: 1.85;
      max-width: 360px;
    }
    .hearts-row {
      font-size: 1.8rem;
      letter-spacing: 10px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }

    /* ═══════════════════════════════════════
       SECTION 2 — MESSAGE WALL
    ═══════════════════════════════════════ */
    #messages-section {
      padding: 80px 24px 100px;
      max-width: 680px;
      margin: 0 auto;
    }

    .section-eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
      display: block;
    }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-style: italic;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .section-desc {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.7;
      margin-bottom: 36px;
      max-width: 440px;
    }

    /* Compose box */
    .compose-box {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(232,67,106,0.2);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 40px;
      backdrop-filter: blur(10px);
    }
    .compose-textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,168,184,0.2);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      line-height: 1.65;
      outline: none;
      resize: vertical;
      min-height: 90px;
      max-height: 220px;
      transition: border-color 0.2s;
    }
    .compose-textarea::placeholder { color: rgba(201,168,184,0.4); }
    .compose-textarea:focus { border-color: rgba(232,67,106,0.5); }

    .compose-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .char-count {
      font-size: 0.78rem;
      color: var(--text-sub);
      opacity: 0.6;
    }
    .send-btn {
      padding: 10px 28px;
      background: linear-gradient(135deg, #c42d54, var(--rose));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
      box-shadow: 0 4px 16px rgba(232,67,106,0.3);
    }
    .send-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,67,106,0.45); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* Messages list */
    #msg-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(232,67,106,0.14);
      border-radius: 14px;
      padding: 18px 20px;
      animation: fadeUp 0.5s ease both;
      transition: border-color 0.25s;
    }
    .msg-card:hover { border-color: rgba(232,67,106,0.3); }

    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }
    .msg-author {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--rose-soft);
      letter-spacing: 0.04em;
    }
    .msg-time {
      font-size: 0.74rem;
      color: var(--text-sub);
      opacity: 0.55;
      white-space: nowrap;
    }
    .msg-body {
      font-size: 0.93rem;
      color: var(--text-main);
      line-height: 1.7;
      opacity: 0.92;
      word-break: break-word;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-sub);
      font-size: 0.9rem;
      opacity: 0.55;
      line-height: 1.8;
    }
    .empty-state .big { font-size: 2.5rem; display: block; margin-bottom: 12px; }

    /* ── Music toggle ── */
    #music-btn {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 50;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(20,5,25,0.75);
      border: 1.5px solid rgba(232,67,106,0.45);
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(10px);
    }
    #music-btn:hover { transform: scale(1.1); box-shadow: 0 10px 28px rgba(232,67,106,0.35); }

    /* ── Divider ── */
    .divider {
      width: 60px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--rose), transparent);
      margin: 0 auto 60px;
    }

    @media (max-width: 480px) {
      .choice-row { flex-direction: column; align-items: center; }
      .btn-yes, .btn-no { width: 100%; max-width: 280px; }
    }
  </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div class="vignette"></div>
<div class="particle-layer" id="particle-layer"></div>

<div class="page">

  <!-- ═══ HERO ═══ -->
  <section id="hero">
    <div class="hero-inner">
      <p class="proposal-label">A question just for you</p>

      <h1 class="hero-title">
        Will you be the<br>
        <span>love of my life?</span>&nbsp;❤️
      </h1>

      <div class="gif-frame">
        <img
          src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif"
          alt="cute panda"
          onerror="this.src='https://media.tenor.com/tQ9E4IU8GtoAAAAj/cute-love.gif'"
        />
      </div>

      <div class="choice-row" id="choice-row">
        <button class="btn-yes" id="yes-btn" onclick="handleYes()">Yes 💕</button>
        <button class="btn-no"  id="no-btn"  onmouseover="runAway(this)" ontouchstart="runAway(this)">No</button>
      </div>
    </div>

    <a class="scroll-cue" href="#messages-section">
      leave a note
      <div class="scroll-arrow"></div>
    </a>
  </section>

  <!-- YES Reveal (replaces choice row) -->
  <section id="yes-reveal">
    <div class="gif-frame" style="width:180px;height:180px;margin-bottom:8px;">
      <img src="https://media.tenor.com/tQ9E4IU8GtoAAAAj/cute-love.gif" alt="love">
    </div>
    <p class="yes-big">I knew you'd say <span>Yes</span> 🎉</p>
    <p class="yes-body">
      You just made me the happiest person alive. 🌸<br>
      I'll be your sunshine, your warmth,<br>
      your person — every single day. 💕
    </p>
    <div class="hearts-row">❤️ 💕 🌹 💕 ❤️</div>
  </section>

  <div class="divider"></div>

  <!-- ═══ MESSAGE WALL ═══ -->
  <section id="messages-section">
    <h2 class="section-title">forever 🌹</h2>

    <!-- Compose -->
    <div class="compose-box">
      <textarea
        id="msg-text"
        class="compose-textarea"
        placeholder="Write something from your heart… it'll live here forever 💕"
        maxlength="500"
        oninput="updateCount()"
      ></textarea>
      <div class="compose-footer">
        <span class="char-count" id="char-count">0 / 500</span>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">Send 💌</button>
      </div>
    </div>

    <!-- Messages -->
    <div id="msg-list"></div>

  </section>

</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Music -->
<audio id="bg-music" loop>
  <source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg">
</audio>
<button id="music-btn" onclick="toggleMusic()" title="Toggle music">🔊</button>

<script type="module">
/* ══════════════════════════════════════════════════
   CANVAS — animated deep rose nebula
══════════════════════════════════════════════════ */
const canvas = document.getElementById('canvas-bg');
const ctx    = canvas.getContext('2d');
let W, H, t = 0, stars = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  stars = Array.from({length:90}, () => ({
    x: Math.random()*W,
    y: Math.random()*H,
    r: Math.random()*1.3 + 0.2,
    p: Math.random()*Math.PI*2,
  }));
}
resize();
window.addEventListener('resize', resize);

function drawBg() {
  ctx.fillStyle = '#0d0811';
  ctx.fillRect(0, 0, W, H);

  [[W*.2,H*.3,W*.48,'rgba(140,20,55,0.32)',0.17,0.11],
   [W*.78,H*.68,W*.42,'rgba(80,0,70,0.28)',-0.13,-0.09],
   [W*.5,H*.5,W*.32,'rgba(190,45,85,0.16)',0.09,0.16],
  ].forEach(([bx,by,r,c,ox,oy]) => {
    const x = bx + Math.sin(t*ox)*W*0.065;
    const y = by + Math.cos(t*oy)*H*0.065;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,c); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  });

  stars.forEach(s => {
    const a = 0.12 + Math.abs(Math.sin(t*0.4+s.p))*0.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,220,235,${a})`;
    ctx.fill();
  });

  t += 0.007;
  requestAnimationFrame(drawBg);
}
drawBg();

/* ══════════════════════════════════════════════════
   PARTICLES
══════════════════════════════════════════════════ */
(function() {
  const layer = document.getElementById('particle-layer');
  const em = ['❤️','💕','💖','🌸','🌺','✨','💝','🫶','💞','🌹','🎀','💗'];
  setInterval(() => {
    const el = document.createElement('span');
    el.className = 'particle';
    el.textContent = em[Math.floor(Math.random()*em.length)];
    el.style.left = Math.random()*100+'vw';
    el.style.fontSize = (11+Math.random()*14)+'px';
    const dur = 6+Math.random()*9;
    el.style.animationDuration = dur+'s';
    el.style.animationDelay   = Math.random()*2+'s';
    layer.appendChild(el);
    setTimeout(()=>el.remove(),(dur+3)*1000);
  }, 600);
})();

/* ══════════════════════════════════════════════════
   MUSIC
══════════════════════════════════════════════════ */
window.addEventListener('load', () => {
  const m = document.getElementById('bg-music');
  m.volume = 0.65;
  m.play().catch(() => {
    const unlock = () => m.play();
    document.addEventListener('click', unlock, {once:true});
    document.addEventListener('touchstart', unlock, {once:true});
  });
});
function toggleMusic() {
  const m = document.getElementById('bg-music');
  const b = document.getElementById('music-btn');
  if (m.paused) { m.play(); b.textContent='🔊'; }
  else           { m.pause(); b.textContent='🔇'; }
}

/* ══════════════════════════════════════════════════
   YES / NO BUTTON
══════════════════════════════════════════════════ */
const noTeases = [
  "That's not an option 🙈",
  "Try again, but really just press Yes 💕",
  "Nope, only Yes is allowed here!",
  "Your heart says Yes, trust it 🌹",
  "Wrong answer, bestie 🥺",
  "You can't escape this question 😌",
  "The No button doesn't work here lol",
  "Nice try though 🥹",
  "Stop running from love 💗",
  "You're making me nervous 🫣",
  "I'll wait here forever if I have to 🌸",
  "That button is broken 😇",
  "Okay but what if you said Yes instead?",
  "This is embarrassing for both of us 😭",
  "I promise I don't bite 🐼",
  "The longer you wait the more hearts appear ❤️",
  "Your finger slipped, it happens 🤭",
];
let noCount = 0;

function runAway(btn) {
  const rect = btn.getBoundingClientRect();
  const maxX = window.innerWidth  - rect.width;
  const maxY = window.innerHeight - rect.height;
  const randX = Math.max(10, Math.min(maxX-10, Math.random()*maxX));
  const randY = Math.max(10, Math.min(maxY-10, Math.random()*maxY));
  btn.style.position  = 'fixed';
  btn.style.left = randX+'px';
  btn.style.top  = randY+'px';
  btn.style.zIndex = 40;
  showToast(noTeases[noCount % noTeases.length]);
  noCount++;
}

function handleYes() {
  document.getElementById('choice-row').style.display = 'none';
  document.getElementById('yes-reveal').style.display = 'flex';
  // Scroll to yes reveal
  document.getElementById('yes-reveal').scrollIntoView({behavior:'smooth', block:'center'});
  launchConfetti();
}

function launchConfetti() {
  const layer = document.getElementById('particle-layer');
  const extra = ['🎉','🎊','💫','⭐','🌟','✨','🫶','💞'];
  for (let i=0; i<30; i++) {
    setTimeout(()=>{
      const el = document.createElement('span');
      el.className = 'particle';
      el.textContent = extra[Math.floor(Math.random()*extra.length)];
      el.style.left = (10+Math.random()*80)+'vw';
      el.style.top  = '-20px';
      el.style.fontSize = (16+Math.random()*18)+'px';
      const dur = 2+Math.random()*2;
      el.style.animationDuration = dur+'s';
      layer.appendChild(el);
      setTimeout(()=>el.remove(),(dur+1)*1000);
    }, i*80);
  }
}

/* ══════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ══════════════════════════════════════════════════
   FIREBASE — real-time message wall
   Visible on ANY device, saved in the cloud forever
══════════════════════════════════════════════════ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {

  authDomain:        "panda-30d7f.firebaseapp.com",

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const col = collection(db, 'messages');

function formatDate(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) +
         ' · ' + d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderMessages(msgs) {
  const list = document.getElementById('msg-list');
  if (!msgs.length) {
    list.innerHTML = `<div class="empty-state">
      <span class="big">🌸</span>
      No messages yet — be the first to leave one ❤️
    </div>`;
    return;
  }
  list.innerHTML = msgs.map(m => `
    <div class="msg-card">
      <div class="msg-header">
        <span class="msg-time">${formatDate(m.ts)}</span>
      </div>
      <p class="msg-body">${escHtml(m.text).replace(/\n/g,'<br>')}</p>
    </div>
  `).join('');
}

// Live listener — updates instantly on all devices
const q = query(col, orderBy('ts', 'desc'));
onSnapshot(q, snap => {
  const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderMessages(msgs);
});

function updateCount() {
  const ta   = document.getElementById('msg-text');
  const span = document.getElementById('char-count');
  span.textContent = ta.value.length + ' / 500';
}

async function sendMessage() {
  const textEl = document.getElementById('msg-text');
  const text   = textEl.value.trim();
  if (!text) { showToast('Write something first 🥺'); return; }

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  try {
    await addDoc(col, { text, ts: serverTimestamp() });
    textEl.value = '';
    updateCount();
    showToast('Message saved forever 💌');
    setTimeout(() => {
      const first = document.querySelector('.msg-card');
      if (first) first.scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 300);
  } catch(e) {
    showToast('Something went wrong 😢 try again');
  }
  btn.disabled = false;
}

window.sendMessage  = sendMessage;
window.toggleMusic  = toggleMusic;
window.handleYes    = handleYes;
window.runAway      = runAway;

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('msg-text').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendMessage();
  });
});
</script>
