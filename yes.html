
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>She said YES! 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --rose:      #e8436a;
      --rose-soft: #f9a8be;
      --ink:       #0d0811;
      --text-main: #f7e9ef;
      --text-sub:  #c9a8b8;
      --gold:      #e8c87d;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--ink);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #canvas-bg {
      position: fixed; inset: 0; z-index: 0;
    }
    .vignette {
      position: fixed; inset: 0; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.68) 100%);
      pointer-events: none;
    }
    .particle-layer {
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none; overflow: hidden;
    }
    .particle {
      position: absolute; top: -60px; user-select: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(380deg) translateX(20px); opacity: 0; }
    }

    .page { position: relative; z-index: 10; }

    /* ── HERO ── */
    #hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px 100px;
      text-align: center; gap: 0; position: relative;
    }
    .hero-inner {
      display: flex; flex-direction: column;
      align-items: center; gap: 22px; max-width: 480px;
    }
    .proposal-label {
      font-size: 0.78rem; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--gold); opacity: 0.85;
    }
    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.6rem, 8vw, 4.8rem);
      font-style: italic; line-height: 1.15; color: var(--text-main);
      animation: fadeUp 1s 0.2s ease both;
    }
    .hero-title span { color: var(--rose-soft); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Main GIF (hero) ── */
    .gif-frame {
      width: 160px; height: 160px;
      border-radius: 20px;
      border: 2.5px solid rgba(232,67,106,0.5);
      box-shadow: 0 0 0 6px rgba(232,67,106,0.08), 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
      animation: fadeUp 1s 0.4s ease both, breathe 4s 1.4s ease-in-out infinite;
    }
    .gif-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

    @keyframes breathe {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    /* ── YES / NO buttons ── */
    .choice-row {
      display: flex; gap: 16px; justify-content: center;
      animation: fadeUp 1s 0.6s ease both; flex-wrap: wrap;
    }
    .btn-yes {
      padding: 15px 44px;
      background: linear-gradient(135deg, #c42d54, var(--rose) 60%, #f06882);
      border: none; border-radius: 50px; color: #fff;
      font-family: 'DM Sans', sans-serif; font-size: 1.05rem; font-weight: 500;
      letter-spacing: 0.05em; cursor: pointer;
      box-shadow: 0 8px 30px rgba(232,67,106,0.4);
      transition: transform 0.22s, box-shadow 0.22s;
    }
    .btn-yes:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 14px 40px rgba(232,67,106,0.55); }

    /* NO button — always fixed on screen, starts bottom-right */
    #no-btn {
      padding: 14px 36px;
      background: rgba(20,5,25,0.7);
      border: 1.5px solid rgba(201,168,184,0.45);
      border-radius: 50px; color: var(--text-sub);
      font-family: 'DM Sans', sans-serif; font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: border-color 0.18s, color 0.18s, box-shadow 0.18s;
      /* FIXED so it's always visible */
      position: fixed;
      bottom: 80px; right: 24px;   /* ← visible starting spot */
      z-index: 999;
    }
    #no-btn:hover { color: var(--text-main); border-color: var(--rose-soft); box-shadow: 0 4px 20px rgba(232,67,106,0.25); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 36px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30,10,30,0.92);
      border: 1px solid rgba(232,67,106,0.4);
      border-radius: 12px; padding: 12px 24px;
      font-size: 0.9rem; color: var(--rose-soft);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100; text-align: center; max-width: 280px;
      backdrop-filter: blur(12px);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Scroll hint ── */
    .scroll-hint {
      position: absolute; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      animation: fadeUp 1s 2.5s ease both;
      text-decoration: none; cursor: pointer; z-index: 10;
    }
    .scroll-hint-pill {
      background: rgba(232,67,106,0.18);
      border: 1.5px solid rgba(232,67,106,0.5);
      border-radius: 30px; padding: 8px 20px;
      color: var(--rose-soft); font-size: 0.82rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      animation: pillPulse 2s ease-in-out infinite;
      white-space: nowrap;
    }
    @keyframes pillPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(232,67,106,0); }
      50%      { box-shadow: 0 0 16px 5px rgba(232,67,106,0.35); }
    }
    .scroll-hint-arrows {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .arr {
      width: 14px; height: 14px;
      border-right: 2px solid var(--rose-soft);
      border-bottom: 2px solid var(--rose-soft);
      transform: rotate(45deg);
      animation: arrBounce 1.4s ease-in-out infinite;
    }
    .arr:nth-child(2) { animation-delay: 0.15s; opacity: 0.6; }
    .arr:nth-child(3) { animation-delay: 0.3s;  opacity: 0.3; }
    @keyframes arrBounce {
      0%,100% { transform: rotate(45deg) translate(0,0); }
      50%      { transform: rotate(45deg) translate(3px,3px); }
    }

    /* ── YES Reveal ── */
    #yes-reveal {
      display: none; flex-direction: column; align-items: center;
      gap: 20px; padding: 60px 24px; text-align: center;
      animation: fadeUp 0.7s ease both;
    }
    /* YES image — proper big rounded box */
    .yes-img-frame {
      width: 220px; height: 220px;
      border-radius: 28px;
      border: 3px solid rgba(232,67,106,0.6);
      box-shadow: 0 0 0 8px rgba(232,67,106,0.12), 0 24px 64px rgba(0,0,0,0.6);
      overflow: hidden;
      animation: breathe 4s ease-in-out infinite;
      background: var(--ink); /* fallback bg so no empty box */
    }
    .yes-img-frame img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .yes-big {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-style: italic; color: var(--text-main);
    }
    .yes-big span { color: var(--rose-soft); }
    .yes-body {
      font-size: 1.05rem; color: var(--text-sub);
      line-height: 1.85; max-width: 360px;
    }
    .hearts-row {
      font-size: 1.8rem; letter-spacing: 10px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }

    /* ── Divider ── */
    .divider {
      width: 60px; height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--rose), transparent);
      margin: 0 auto 60px;
    }

    /* ── Message section ── */
    #messages-section {
      padding: 80px 24px 100px;
      max-width: 680px; margin: 0 auto;
    }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-style: italic; color: var(--text-main);
      margin-bottom: 28px; line-height: 1.3;
    }
    .compose-box {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(232,67,106,0.2);
      border-radius: 16px; padding: 20px; margin-bottom: 40px;
      backdrop-filter: blur(10px);
    }
    .compose-textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,168,184,0.2);
      border-radius: 10px; padding: 12px 16px;
      color: var(--text-main); font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem; line-height: 1.65; outline: none;
      resize: vertical; min-height: 90px; max-height: 220px;
      transition: border-color 0.2s;
    }
    .compose-textarea::placeholder { color: rgba(201,168,184,0.4); }
    .compose-textarea:focus { border-color: rgba(232,67,106,0.5); }
    .compose-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 12px; gap: 12px; flex-wrap: wrap;
    }
    .char-count { font-size: 0.78rem; color: var(--text-sub); opacity: 0.6; }
    .send-btn {
      padding: 10px 28px;
      background: linear-gradient(135deg, #c42d54, var(--rose));
      border: none; border-radius: 10px; color: #fff;
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500;
      cursor: pointer; transition: transform 0.18s, box-shadow 0.18s;
      box-shadow: 0 4px 16px rgba(232,67,106,0.3);
    }
    .send-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,67,106,0.45); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    #msg-list { display: flex; flex-direction: column; gap: 16px; }
    .msg-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(232,67,106,0.14);
      border-radius: 14px; padding: 18px 20px;
      animation: fadeUp 0.5s ease both;
      transition: border-color 0.25s;
    }
    .msg-card:hover { border-color: rgba(232,67,106,0.3); }
    .msg-time { font-size: 0.74rem; color: var(--text-sub); opacity: 0.55; display: block; margin-bottom: 8px; }
    .msg-body { font-size: 0.93rem; color: var(--text-main); line-height: 1.7; word-break: break-word; }
    .empty-state {
      text-align: center; padding: 48px 24px;
      color: var(--text-sub); font-size: 0.9rem; opacity: 0.55; line-height: 1.8;
    }
    .empty-state .big { font-size: 2.5rem; display: block; margin-bottom: 12px; }

    /* ── Music btn ── */
    #music-btn {
      position: fixed; bottom: 22px; right: 22px; z-index: 50;
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(20,5,25,0.75);
      border: 1.5px solid rgba(232,67,106,0.45);
      color: var(--text-main); font-size: 1.2rem; cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      transition: transform 0.2s; backdrop-filter: blur(10px);
    }
    #music-btn:hover { transform: scale(1.1); }
  </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div class="vignette"></div>
<div class="particle-layer" id="particle-layer"></div>

<!-- NO button — outside everything, always fixed on screen -->
<button id="no-btn" onmouseover="runAway()" ontouchstart="runAway()">No</button>

<div class="page">

  <!-- HERO -->
  <section id="hero">
    <div class="hero-inner">
      <p class="proposal-label">A question just for you</p>
      <h1 class="hero-title">Will you be the<br><span>love of my life?</span>&nbsp;❤️</h1>

      <div class="gif-frame">
        <img src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif" alt="cute panda">
      </div>

      <div class="choice-row" id="choice-row">
        <button class="btn-yes" onclick="handleYes()">Yes 💕</button>
      </div>
    </div>

    <!-- Scroll hint — bold and obvious -->
    <a class="scroll-hint" href="#messages-section">
      <div class="scroll-hint-pill">💌 leave a message below</div>
      <div class="scroll-hint-arrows">
        <div class="arr"></div>
        <div class="arr"></div>
        <div class="arr"></div>
      </div>
    </a>
  </section>

  <!-- YES Reveal -->
  <section id="yes-reveal">
    <div class="yes-img-frame">
      <img
        id="yes-img"
        src="https://media.tenor.com/tQ9E4IU8GtoAAAAj/cute-love.gif"
        alt="love"
      >
    </div>
    <p class="yes-big">I knew you'd say <span>Yes</span> 🎉</p>
    <p class="yes-body">
      You just made me the happiest person alive. 🌸<br>
      I'll be your sunshine, your warmth,<br>
      your person — every single day. 💕
    </p>
    <div class="hearts-row">❤️ 💕 🌹 💕 ❤️</div>
  </section>

  <div class="divider"></div>

  <!-- MESSAGE WALL -->
  <section id="messages-section">
    <h2 class="section-title">forever 🌹</h2>
    <div class="compose-box">
      <textarea
        id="msg-text"
        class="compose-textarea"
        placeholder="Anything in your heart… remains forever 💕"
        maxlength="500"
        oninput="updateCount()"
      ></textarea>
      <div class="compose-footer">
        <span class="char-count" id="char-count">0 / 500</span>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">Send 💌</button>
      </div>
    </div>
    <div id="msg-list"></div>
  </section>

</div>

<div id="toast"></div>
<audio id="bg-music" loop><source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg"></audio>
<button id="music-btn" onclick="toggleMusic()">🔊</button>

<script type="module">
/* ── CANVAS ── */
const canvas = document.getElementById('canvas-bg');
const ctx = canvas.getContext('2d');
let W, H, t = 0, stars = [];
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  stars = Array.from({length:90}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.3+0.2, p: Math.random()*Math.PI*2
  }));
}
resize();
window.addEventListener('resize', resize);
function drawBg() {
  ctx.fillStyle='#0d0811'; ctx.fillRect(0,0,W,H);
  [[W*.2,H*.3,W*.48,'rgba(140,20,55,0.32)',0.17,0.11],
   [W*.78,H*.68,W*.42,'rgba(80,0,70,0.28)',-0.13,-0.09],
   [W*.5,H*.5,W*.32,'rgba(190,45,85,0.16)',0.09,0.16]
  ].forEach(([bx,by,r,c,ox,oy]) => {
    const x=bx+Math.sin(t*ox)*W*0.065, y=by+Math.cos(t*oy)*H*0.065;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,c); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  });
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,220,235,${0.1+Math.abs(Math.sin(t*0.4+s.p))*0.3})`;
    ctx.fill();
  });
  t+=0.007; requestAnimationFrame(drawBg);
}
drawBg();

/* ── PARTICLES ── */
(function(){
  const layer=document.getElementById('particle-layer');
  const em=['❤️','💕','💖','🌸','🌺','✨','💝','🫶','💞','🌹','🎀','💗'];
  setInterval(()=>{
    const el=document.createElement('span');
    el.className='particle';
    el.textContent=em[Math.floor(Math.random()*em.length)];
    el.style.left=Math.random()*100+'vw';
    el.style.fontSize=(11+Math.random()*14)+'px';
    const dur=6+Math.random()*9;
    el.style.animationDuration=dur+'s';
    el.style.animationDelay=Math.random()*2+'s';
    layer.appendChild(el);
    setTimeout(()=>el.remove(),(dur+3)*1000);
  },600);
})();

/* ── MUSIC ── */
window.addEventListener('load',()=>{
  const m=document.getElementById('bg-music');
  m.volume=0.65;
  m.play().catch(()=>{
    const u=()=>m.play();
    document.addEventListener('click',u,{once:true});
    document.addEventListener('touchstart',u,{once:true});
  });
});
function toggleMusic(){
  const m=document.getElementById('bg-music'), b=document.getElementById('music-btn');
  if(m.paused){m.play();b.textContent='🔊';}else{m.pause();b.textContent='🔇';}
}

/* ── NO BUTTON — always visible, teleports on hover/touch ── */
const noTeases=[
  "That's not an option 🙈",
  "Try again, but really just press Yes 💕",
  "Nope, only Yes is allowed here!",
  "Your heart says Yes, trust it 🌹",
  "Wrong answer, bestie 🥺",
  "You can't escape this question 😌",
  "The No button doesn't work here lol",
  "Nice try though 🥹",
  "Stop running from love 💗",
  "You're making me nervous 🫣",
  "I'll wait here forever if I have to 🌸",
  "That button is broken 😇",
  "Okay but what if you said Yes instead?",
  "This is embarrassing for both of us 😭",
  "I promise I don't bite 🐼",
  "The longer you wait the more hearts appear ❤️",
  "Your finger slipped, it happens 🤭",
];
let noCount=0;

function runAway(){
  const btn=document.getElementById('no-btn');
  const bW=btn.offsetWidth||110, bH=btn.offsetHeight||48, pad=20;
  const safeW=window.innerWidth-bW-pad, safeH=window.innerHeight-bH-pad;
  // pick random spot but avoid current position
  let nx,ny,tries=0;
  do {
    nx=pad+Math.random()*safeW;
    ny=pad+Math.random()*safeH;
    tries++;
  } while(tries<10 && Math.abs(nx-parseInt(btn.style.right||'24'))<80 && Math.abs(ny-parseInt(btn.style.bottom||'80'))<80);
  // Use left/top absolute positioning
  btn.style.right='auto'; btn.style.bottom='auto';
  btn.style.left=nx+'px';
  btn.style.top=ny+'px';
  showToast(noTeases[noCount%noTeases.length]);
  noCount++;
}

/* ── YES ── */
function handleYes(){
  document.getElementById('no-btn').style.display='none';
  document.getElementById('choice-row').style.display='none';
  const reveal=document.getElementById('yes-reveal');
  reveal.style.display='flex';
  reveal.scrollIntoView({behavior:'smooth',block:'center'});
  launchConfetti();
}

function launchConfetti(){
  const layer=document.getElementById('particle-layer');
  const extra=['😘','🥰','❤️','🌹','💖','🫶','💞'];
  for(let i=0;i<30;i++){
    setTimeout(()=>{
      const el=document.createElement('span');
      el.className='particle';
      el.textContent=extra[Math.floor(Math.random()*extra.length)];
      el.style.left=(10+Math.random()*80)+'vw';
      el.style.top='-20px';
      el.style.fontSize=(16+Math.random()*18)+'px';
      const dur=2+Math.random()*2;
      el.style.animationDuration=dur+'s';
      layer.appendChild(el);
      setTimeout(()=>el.remove(),(dur+1)*1000);
    },i*80);
  }
}

/* ── TOAST ── */
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ── FIREBASE ── */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,collection,addDoc,onSnapshot,orderBy,query,serverTimestamp}
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCvi2aSdkckODXzkzuDqg3YpfKlupt5Gug",
  authDomain:"panda-30d7f.firebaseapp.com",
  projectId:"panda-30d7f",
  storageBucket:"panda-30d7f.firebasestorage.app",
  messagingSenderId:"316320865260",
  appId:"1:316320865260:web:b56189edff9536299efec9"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const col=collection(db,'messages');

function formatDate(ts){
  if(!ts)return '';
  const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+
    ' · '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function renderMessages(msgs){
  const list=document.getElementById('msg-list');
  if(!msgs.length){
    list.innerHTML=`<div class="empty-state"><span class="big">🌸</span>No Treasure yet —  leave one ❤️, </div>`;
    return;
  }
  list.innerHTML=msgs.map(m=>`
    <div class="msg-card">
      <span class="msg-time">${formatDate(m.ts)}</span>
      <p class="msg-body">${escHtml(m.text).replace(/\n/g,'<br>')}</p>
    </div>`).join('');
}
const q=query(col,orderBy('ts','desc'));
onSnapshot(q,snap=>{
  renderMessages(snap.docs.map(d=>({id:d.id,...d.data()})));
});

function updateCount(){
  const ta=document.getElementById('msg-text');
  document.getElementById('char-count').textContent=ta.value.length+' / 500';
}
async function sendMessage(){
  const textEl=document.getElementById('msg-text');
  const text=textEl.value.trim();
  if(!text){showToast('Write something first 🥺');return;}
  const btn=document.getElementById('send-btn');
  btn.disabled=true;
  try{
    await addDoc(col,{text,ts:serverTimestamp()});
    textEl.value=''; updateCount();
    showToast('Message for forever 💌');
    setTimeout(()=>{
      const f=document.querySelector('.msg-card');
      if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'});
    },300);
  }catch(e){ showToast('Something went wrong 😢 try again'); }
  btn.disabled=false;
}

/* ── Expose to HTML onclick ── */
window.toggleMusic=toggleMusic;
window.handleYes=handleYes;
window.runAway=runAway;
window.sendMessage=sendMessage;
window.updateCount=updateCount;

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('msg-text').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))sendMessage();
  });
});
