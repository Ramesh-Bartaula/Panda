
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>She said YES! 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #b5003d 0%, #ff6f91 50%, #ff9a9e 100%);
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      position: relative;
      overflow: hidden;
    }

    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }
    .heart-particle {
      position: absolute;
      animation: floatUp linear infinite;
      opacity: 0;
      user-select: none;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) rotate(0deg);   opacity: 0.9; }
      100% { transform: translateY(-120px) rotate(360deg); opacity: 0;  }
    }

    /* Compact semi-transparent dark glass card */
  /* --- 100% TRANSPARENT CARD --- */
    .yes-container {
        position: relative;
        z-index: 10;
        text-align: center;
  
        background: transparent; 
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: none;
        box-shadow: none;
        padding: 10px; 
        max-width: 360px;
        width: 85%;
        animation: appear 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      }

    .yes-rose {
      font-size: 3.2rem;
      display: block;
      margin-bottom: 2px;
      animation: bounce 1.1s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0)     rotate(-6deg); }
      to   { transform: translateY(-10px)  rotate(6deg); }
    }

    .yes-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: #000000;;
      margin-bottom: 8px;
      line-height: 1.2;
      text-shadow: 0 2px 20px rgba(255, 80, 130, 0.85);
    }

    .gif-yes {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 8px auto 12px;
      border: 3px solid rgba(255, 143, 171, 0.8);
      box-shadow: 0 6px 20px rgba(255, 100, 150, 0.5);
      overflow: hidden;
    }
    .gif-yes img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .yes-message {
      font-size: 1.5rem;
      font-weight: 700;
      color: #000000;;
      line-height: 1.6;
      margin-bottom: 14px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    .love-line {
      font-size: 1.4rem;
      color: #000000;;
      font-weight: 900;
      display: block;
      margin-bottom: 5px;
      text-shadow: 0 2px 16px rgba(255, 50, 100, 0.7);
    }

    .yes-hearts {
      font-size: 1.8rem;
      letter-spacing: 8px;
      display: block;
      animation: pulse 1.3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    }
      50%       { transform: scale(1.16); }
    }

    #music-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      font-size: 1.3rem;
      background: rgba(20, 0, 30, 0.55);
      border: 1.5px solid rgba(255, 143, 171, 0.6);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: transform 0.2s;
      color: white;
    }
    #music-toggle:hover { transform: scale(1.12); }

    @media (max-width: 480px) {
      .yes-container { padding: 22px 18px 20px; }
      .yes-title     { font-size: 1.9rem; }
      .yes-message   { font-size: 0.95rem; }
      .yes-rose      { font-size: 2.4rem; }
      .gif-yes       { width: 84px; height: 84px; }
    }
  </style>
</head>
<body>

  <div class="hearts-bg" id="hearts-bg"></div>

  <div class="yes-container">
    <span class="yes-rose">🌹</span>
    <h1 class="yes-title">I knew you'd say Yes 🎉</h1>

    <div class="gif-yes">
      <img
        src="https://media.tenor.com/tQ9E4IU8GtoAAAAj/cute-love.gif"
        onerror="this.src='https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif'"
        alt="love"
      >
    </div>

    <p class="yes-message">
      <span class="love-line">I love you ❤️ ❤️ ❤️</span>
      You just made me the happiest person alive.<br>
      I'll be your sunshine, your warmth, your person<br>
      every single day. 🌸
    </p>

    <span class="yes-hearts">❤️ 💕 🌹 💕 ❤️</span>
  </div>

  <audio id="bg-music" loop>
    <source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg">
  </audio>
  <button id="music-toggle" onclick="toggleMusic()" title="Toggle music">🔊</button>

  <script>
    /* ── Propose-on-knee background (tries multiple sources) ──────── */
    (function loadBg() {
      const candidates = [
        // Anime couple with rose — wallpapers.com CDN
        'https://wallpapers.com/images/hd/couple-holding-rose-love-anime-0jk6jdv4yt19t768.jpg',
        // Man kneeling/crowning woman — wallpapers.com CDN
        'https://wallpapers.com/images/hd/man-crowning-woman-love-anime-tuiq82k2xmucatv9.jpg',
        // Ghibli romantic scenes as fallbacks
        'https://www.ghibli.jp/gallery/howl007.jpg',
        'https://www.ghibli.jp/gallery/howl013.jpg',
      ];

      let i = 0;
      function tryNext() {
        if (i >= candidates.length) return;
        const img = new Image();
        img.onload = () => {
          document.body.style.backgroundImage    = `url('${candidates[i]}')`;
          document.body.style.backgroundSize     = 'cover';
          document.body.style.backgroundPosition = 'center top';
        };
        img.onerror = () => { i++; tryNext(); };
        img.src = candidates[i];
      }
      tryNext();
    })();

    /* ── Music autoplay ─────────────────────────────────────────────── */
    window.addEventListener('load', () => {
      const music  = document.getElementById('bg-music');
      music.volume = 0.7;
      music.muted  = false;
      music.play().catch(() => {
        const unlock = () => { music.play(); };
        document.addEventListener('click',      unlock, { once: true });
        document.addEventListener('touchstart', unlock, { once: true });
      });
    });

    function toggleMusic() {
      const m = document.getElementById('bg-music');
      const b = document.getElementById('music-toggle');
      if (m.paused) { m.play();  b.textContent = '🔊'; }
      else          { m.pause(); b.textContent = '🔇'; }
    }

    /* ── Dense floating hearts ──────────────────────────────────────── */
    (function spawnHearts() {
      const container = document.getElementById('hearts-bg');
      const emojis    = ['❤️','💕','💖','💗','💓','🌹','🌸','✨','💝','🫶','💞','🎀'];
      setInterval(() => {
        const el          = document.createElement('span');
        el.className      = 'heart-particle';
        el.textContent    = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left     = Math.random() * 100 + 'vw';
        el.style.fontSize = (14 + Math.random() * 22) + 'px';
        const dur         = 3 + Math.random() * 5;
        el.style.animationDuration = dur + 's';
        el.style.animationDelay   = Math.random() * 1.5 + 's';
        container.appendChild(el);
        setTimeout(() => el.remove(), (dur + 2) * 1000);
      }, 380);
    })();
  </script>

</body>
</html>
