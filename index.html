<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will you be love of my life? ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts-bg" id="hearts-bg"></div>

  <div class="container">
    <h1>Will you be love of my life? ❤️</h1>
    <div class="gif-container">
      <img id="cat-gif" src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif" alt="cute character">
    </div>
    <div class="buttons" id="buttons">
      <button id="yes-btn" onclick="handleYesClick()">Yes 💕</button>
      <button id="no-btn" onclick="handleNoClick()">No</button>
    </div>
    <p class="hint-text" id="hint-text">Choose wisely... 🥺</p>
  </div>

  <!-- Modal Popup for No messages -->
  <div id="popup-overlay" class="popup-overlay hidden">
    <div class="popup-box">
      <div id="popup-message"></div>
      <button class="popup-close-btn" onclick="closePopup()">Okay fine... 😔</button>
    </div>
  </div>

  <!-- Only Yes left message -->
  <div id="only-yes-banner" class="only-yes-banner hidden">
    🚫 The "No" option has left the building. It gave up on you. 🚫
  </div>

  <audio id="bg-music" loop>
    <source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg">
  </audio>
  <button id="music-toggle" onclick="toggleMusic()" title="Toggle music">🔊</button>

  <script src="script.js"></script>
</body>
</html>
