<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will you be love of my life ? ❤️ </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* ── Password Gate Overlay ── */
    #gate-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(135deg, #ffe4f0 0%, #ffd6e8 50%, #ffcce4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
    }

    #gate-box {
      background: white;
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(255, 100, 150, 0.25);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    #gate-box .gate-emoji {
      font-size: 52px;
      margin-bottom: 8px;
    }

    #gate-box h2 {
      color: #d63384;
      font-size: 1.4rem;
      font-weight: 800;
      margin: 0 0 8px;
    }

    #gate-box p.gate-sub {
      color: #888;
      font-size: 0.92rem;
      margin: 0 0 22px;
    }

    #gate-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #ffb3cc;
      border-radius: 12px;
      font-size: 1.1rem;
      font-family: 'Nunito', sans-serif;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
      letter-spacing: 2px;
    }

    #gate-input:focus { border-color: #d63384; }

    #gate-input.shake {
      animation: shake 0.4s ease;
      border-color: #e74c3c;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-6px); }
      80%       { transform: translateX(6px); }
    }

    #gate-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ff6b9d, #d63384);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    #gate-btn:hover  { opacity: 0.9; }
    #gate-btn:active { transform: scale(0.97); }

    #gate-msg {
      margin-top: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      min-height: 20px;
      color: #e74c3c;
    }

    #gate-msg.success { color: #27ae60; }

    #gate-chances {
      margin-top: 10px;
      font-size: 0.82rem;
      color: #bbb;
    }

    /* Locked screen */
    #locked-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(135deg, #ffe4f0, #ffd6e8);
      font-family: 'Nunito', sans-serif;
      text-align: center;
      padding: 20px;
    }

    #locked-screen .lock-emoji { font-size: 72px; margin-bottom: 16px; }
    #locked-screen h2 { color: #c0392b; font-size: 1.6rem; font-weight: 900; margin: 0 0 10px; }
    #locked-screen p  { color: #888; font-size: 1rem; }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════════
       PASSWORD GATE — shown until correct answer
       ══════════════════════════════════════════ -->
  <div id="gate-overlay">
    <div id="gate-box">
      <div class="gate-emoji">💌</div>
      <h2>Hey, do I know you? 🥺</h2>
      <p class="gate-sub">What was the name you gave me?<br>or… the first doll I gave you when we met later. 🧸</p>

      <input
        id="gate-input"
        type="text"
        placeholder="Enter the name..."
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        onkeydown="if(event.key==='Enter') checkAnswer()"
      />

      <button id="gate-btn" onclick="checkAnswer()">💕 Enter</button>

      <div id="gate-msg"></div>
      <div id="gate-chances">3 chances remaining</div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       LOCKED SCREEN — shown after 3 wrong tries
       ══════════════════════════════════════════ -->
  <div id="locked-screen">
    <div class="lock-emoji">🔒</div>
    <h2>Access Denied 💔</h2>
    <p>You didn't know the name...<br>This page isn't for you. 🥺</p>
  </div>

  <!-- ══════════════════════════════════════════
       MAIN CONTENT (hidden until unlocked)
       ══════════════════════════════════════════ -->
  <div id="main-content" style="display:none;">
    <div class="hearts-bg"></div>
    <div class="container">
      <h1>Will you be love of my life ? ❤️ </h1>
      <div class="gif-container">
        <img id="cat-gif" src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif" alt="cute character">
      </div>
      <div class="buttons">
        <button id="yes-btn" onclick="handleYesClick()">Yes 💕</button>
        <button id="no-btn" onclick="handleNoClick()">No</button>
      </div>
      <div id="tease-toast"></div>
    </div>

    <audio id="bg-music" loop autoplay muted>
      <source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" onclick="toggleMusic()" title="Toggle music">🔊</button>
  </div>

  <!-- Gate script — must run before anything else -->
  <script>
    const CORRECT = "koala";
    let chancesLeft = 3;

    function checkAnswer() {
      const input = document.getElementById("gate-input");
      const msg   = document.getElementById("gate-msg");
      const info  = document.getElementById("gate-chances");
      const val   = input.value.trim().toLowerCase();

      if (!val) return;

      if (val === CORRECT) {
        msg.textContent = "✅ Welcome! 🥰";
        msg.className   = "success";
        input.disabled  = true;
        document.getElementById("gate-btn").disabled = true;

        setTimeout(() => {
          document.getElementById("gate-overlay").style.display = "none";
          document.getElementById("main-content").style.display = "block";

          // Auto-play music after unlock (needs user gesture — already happened via button click)
          const music = document.getElementById("bg-music");
          if (music) { music.muted = false; music.play().catch(() => {}); }
        }, 800);

      } else {
        chancesLeft--;
        input.value = "";
        input.classList.remove("shake");
        // Force reflow to re-trigger animation
        void input.offsetWidth;
        input.classList.add("shake");

        if (chancesLeft <= 0) {
          // Lock them out
          document.getElementById("gate-overlay").style.display = "none";
          document.getElementById("locked-screen").style.display = "flex";
        } else {
          msg.textContent = chancesLeft === 1
            ? "❌ Wrong... last chance! 💔"
            : `❌ That's not it... try again 😔`;
          info.textContent = chancesLeft + " chance" + (chancesLeft === 1 ? "" : "s") + " remaining";
        }
      }
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
