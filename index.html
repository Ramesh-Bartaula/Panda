<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be the love of my life? 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'Nunito',sans-serif;background:#050218}

/* ── SCENES ── */
#night-scene,#yes-scene{position:fixed;inset:0;width:100%;height:100%}
#yes-scene{opacity:0;pointer-events:none;transition:opacity 2.2s ease}
#yes-scene.visible{opacity:1;pointer-events:all}
#night-scene{transition:opacity 1.8s ease}
#night-scene.fade{opacity:0;pointer-events:none}

.full-svg{position:absolute;inset:0;width:100%;height:100%}

/* ── STARS ── */
#starfield{position:absolute;inset:0;z-index:0}

/* ── PARTICLES ── */
.petal{position:fixed;pointer-events:none;z-index:4;opacity:0;animation:petalFall linear infinite}
@keyframes petalFall{
  0%  {transform:translateY(-30px) rotate(0deg) translateX(0px);opacity:0}
  6%  {opacity:.88}
  90% {opacity:.5}
  100%{transform:translateY(110vh) rotate(680deg) translateX(50px);opacity:0}
}
.fly{position:fixed;border-radius:50%;pointer-events:none;z-index:5;animation:flyDrift ease-in-out infinite}
@keyframes flyDrift{
  0%,100%{transform:translate(0,0);opacity:0}
  20%{opacity:1}
  50%{transform:translate(var(--tx),var(--ty));opacity:.9}
  80%{opacity:.6}
}
.spark{position:fixed;border-radius:50%;pointer-events:none;z-index:400;animation:sparkOut ease-out forwards}
@keyframes sparkOut{
  0%  {opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0)}
}

/* ── MAIN OVERLAY CARD ── */
#content{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5.5vh;pointer-events:none;transition:opacity 1s ease}
#content.gone{opacity:0;pointer-events:none}
.card{
  pointer-events:all;
  background:rgba(5,2,24,.62);
  backdrop-filter:blur(22px) saturate(1.5);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid rgba(255,180,230,.18);
  border-radius:30px;
  padding:2.4rem 3.4rem 2.2rem;
  text-align:center;
  max-width:520px;
  width:91vw;
  box-shadow:0 0 80px rgba(160,60,200,.12),0 20px 64px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.07);
}
.panda{font-size:2.8rem;display:block;margin-bottom:.5rem;animation:pandaBob 3.6s ease-in-out infinite}
@keyframes pandaBob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-11px) rotate(5deg)}}
.question{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(1.55rem,3.6vw,2.3rem);
  color:#fff5f8;line-height:1.32;margin-bottom:.45rem;
  text-shadow:0 2px 28px rgba(210,90,170,.45);
}
.tagline{font-size:.72rem;color:rgba(255,190,230,.42);letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem}
.btns{display:flex;gap:1.1rem;justify-content:center;align-items:center;flex-wrap:wrap}

#yes-btn{
  background:linear-gradient(135deg,#c83878,#e05090,#f880b0);
  color:#fff;border:none;padding:.9rem 2.8rem;border-radius:50px;
  font-size:1.08rem;font-family:'Nunito',sans-serif;font-weight:900;
  cursor:pointer;letter-spacing:.04em;
  box-shadow:0 5px 28px rgba(200,56,120,.55);
  transition:transform .18s,box-shadow .18s;
  transform-origin:center;
}
#yes-btn:hover{transform:scale(1.11) translateY(-3px);box-shadow:0 10px 38px rgba(200,56,120,.72)}
#yes-btn:active{transform:scale(.96)}

#no-btn{
  position:fixed;background:rgba(255,255,255,.05);
  color:rgba(255,200,235,.48);border:1px solid rgba(255,190,230,.2);
  padding:.9rem 2.1rem;border-radius:50px;
  font-size:1.08rem;font-family:'Nunito',sans-serif;font-weight:700;
  cursor:pointer;z-index:30;
  transition:color .12s,border-color .12s;
}
#no-btn:hover{color:rgba(255,190,230,.25)}

/* ── BIG POPUP ── */
#popup{
  position:fixed;inset:0;z-index:200;
  background:rgba(3,1,16,.78);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .28s;
}
#popup.open{opacity:1;pointer-events:all}
.popup-inner{
  background:rgba(10,4,36,.94);
  border:1.5px solid rgba(255,160,220,.25);
  border-radius:34px;
  padding:3.2rem 3.8rem 2.8rem;
  max-width:540px;width:86vw;
  text-align:center;
  box-shadow:0 0 120px rgba(180,60,160,.22),0 40px 100px rgba(0,0,0,.75);
  animation:popBounce .42s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popBounce{from{transform:scale(.68);opacity:0}to{transform:scale(1);opacity:1}}
.p-icon{font-size:4.5rem;display:block;margin-bottom:1rem;animation:iconWiggle .55s ease .15s both}
@keyframes iconWiggle{0%,100%{transform:rotate(0)}28%{transform:rotate(-14deg)}72%{transform:rotate(14deg)}}
.p-msg{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(1.35rem,3.2vw,1.95rem);
  color:#ffe0f0;line-height:1.5;margin-bottom:2rem;
  text-shadow:0 2px 18px rgba(210,80,160,.3);
}
.p-btn{
  background:linear-gradient(135deg,#b83068,#d04880);
  color:#fff;border:none;
  padding:.8rem 2.8rem;border-radius:50px;
  font-size:1rem;font-family:'Nunito',sans-serif;font-weight:900;
  cursor:pointer;letter-spacing:.04em;
  box-shadow:0 4px 22px rgba(180,48,120,.48);
  transition:transform .15s;
}
.p-btn:hover{transform:scale(1.07)}
.p-btn:active{transform:scale(.97)}

/* ── YES SCENE CARD ── */
#yes-card{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:5.5vh;
  opacity:0;pointer-events:none;
  transition:opacity 1.6s ease .8s;
}
#yes-card.show{opacity:1}
.yc{
  background:rgba(5,2,22,.68);backdrop-filter:blur(22px);
  border:1px solid rgba(255,190,230,.28);border-radius:30px;
  padding:2.2rem 3rem;text-align:center;max-width:480px;width:88vw;
  box-shadow:0 0 80px rgba(200,80,160,.15),0 20px 60px rgba(0,0,0,.65);
}
.y-icon{font-size:4rem;display:block;margin-bottom:.7rem;animation:hPulse 1.2s ease-in-out infinite}
@keyframes hPulse{0%,100%{transform:scale(1)}45%{transform:scale(1.22)}65%{transform:scale(1)}}
.y-h{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(1.7rem,3.8vw,2.5rem);color:#ffe4f2;
  margin-bottom:.5rem;text-shadow:0 0 40px rgba(255,130,190,.5);
}
.y-s{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:1.1rem;color:rgba(255,200,235,.65);
}

/* ── MUSIC BTN ── */
#mbtn{
  position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;
  background:rgba(6,2,26,.72);backdrop-filter:blur(12px);
  border:1px solid rgba(255,190,230,.2);color:#ffccee;
  font-size:1.25rem;cursor:pointer;z-index:500;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
#mbtn:hover{transform:scale(1.1)}

<!-- ── PARTICLE CONTAINERS ── -->
<div id="petals" style="position:fixed;inset:0;z-index:6;pointer-events:none"></div>
<div id="flies"  style="position:fixed;inset:0;z-index:5;pointer-events:none"></div>

<!-- ── MAIN QUESTION CARD ── -->
<div id="content">
  <div class="card">
    <span class="panda">🐼</span>
    <p class="question">Will you be the love of my life?</p>
    <p class="tagline">✦ made with every star in the sky, just for you ✦</p>
    <div class="btns">
      <button id="yes-btn" onclick="handleYes()">Yes, forever 💕</button>
      <button id="no-btn" onmouseover="noRun()" onclick="noRun()">No…</button>
    </div>
  </div>
</div>

<!-- ── BIG POPUP ── -->
<div id="popup">
  <div class="popup-inner">
    <span class="p-icon" id="p-icon">🥺</span>
    <p  class="p-msg"  id="p-msg">Are you really sure about that?</p>
    <button class="p-btn" onclick="closePopup()">Hmm… let me reconsider 🌸</button>
  </div>
</div>

<!-- ── YES OVERLAY CARD ── -->
<div id="yes-card">
  <div class="yc">
    <span class="y-icon">🌸</span>
    <p class="y-h">I knew you'd say yes… 💗</p>
    <p class="y-s">You make every moment feel like magic, my love. 🐼✨</p>
  </div>
</div>

<!-- AUDIO -->
<audio id="bgm" loop>
  <source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg">
</audio>
<button id="mbtn" onclick="toggleMusic()">🎵</button>

<script>
/* ══ STARS ══ */
const cvs=document.getElementById('starfield'),ctx=cvs.getContext('2d');let stars=[];
function rsz(){cvs.width=innerWidth;cvs.height=innerHeight}
function mkStars(){stars=[];for(let i=0;i<290;i++)stars.push({x:Math.random()*cvs.width,y:Math.random()*cvs.height*.78,r:Math.random()*1.9+.3,a:Math.random()*.9+.1,sp:Math.random()*.009+.002,ph:Math.random()*Math.PI*2})}
function drawStars(t){ctx.clearRect(0,0,cvs.width,cvs.height);stars.forEach(s=>{const a=s.a*(.58+.42*Math.sin(t*s.sp+s.ph));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,248,210,${a.toFixed(2)})`;ctx.fill()});requestAnimationFrame(drawStars)}
rsz();mkStars();window.addEventListener('resize',()=>{rsz();mkStars()});requestAnimationFrame(drawStars);

/* ══ FIREFLIES ══ */
(function(){const c=document.getElementById('flies'),cols=['#ffe898','#c8ffc8','#ffc8ff','#c8e8ff','#ffe0c8','#d0ffee'];
for(let i=0;i<34;i++){const f=document.createElement('div');f.className='fly';const col=cols[i%cols.length],sz=4+Math.random()*4.5;
f.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}vw;top:${22+Math.random()*62}vh;background:${col};box-shadow:0 0 9px 5px ${col}99;--tx:${(Math.random()-.5)*170}px;--ty:${(Math.random()-.5)*110}px;animation-duration:${4.5+Math.random()*7.5}s;animation-delay:${Math.random()*-14}s`;
c.appendChild(f)}})();

/* ══ PETALS ══ */
(function(){const c=document.getElementById('petals'),cols=['#ffb8d0','#ffcce0','#ff99bb','#ffd4e8','#e8b0ff','#ffc4d8','#ffccee'];
for(let i=0;i<30;i++){const p=document.createElement('div');p.className='petal';const col=cols[i%cols.length],sz=10+Math.random()*16,sk=(Math.random()-.5)*28;
p.style.cssText=`left:${Math.random()*108}vw;width:${sz}px;height:${sz*1.45}px;background:${col};border-radius:${50+sk}% ${Math.random()*18}% ${50-sk}% ${Math.random()*18}%;animation-duration:${11+Math.random()*14}s;animation-delay:${Math.random()*-28}s`;
c.appendChild(p)}})();

/* ══ NO BUTTON ══ */
const noBtn=document.getElementById('no-btn');let nc=0;
noBtn.style.cssText+='right:14vw;bottom:12.5vh;position:fixed';

const msgs=[
  {i:'🥺',m:"Are you really sure? I can hear your heart whispering… YES."},
  {i:'🐼',m:"The panda built this whole page for you. He's very disappointed right now."},
  {i:'🌸',m:"Every sakura petal paused mid-fall just to stare at you in disbelief."},
  {i:'🌕',m:"The moon just dimmed a little. She was rooting for you two all night."},
  {i:'💫',m:"All 290 stars in the sky flickered at once. They believe in you both."},
  {i:'🏮',m:"The paper lanterns are losing their warm glow. Only a YES can light them back up."},
  {i:'🌿',m:"The forest spirits held an emergency meeting. Their unanimous verdict: YES."},
  {i:'🎵',m:"The music is literally playing your love song right now. Can you not hear it?!"},
  {i:'🥲',m:"I painted this entire magical night sky and drew every single star… just for this moment."},
  {i:'✨',m:"The magical sakura tree is whispering softly: 'say yes… say yes… say yes…'"},
  {i:'🌺',m:"The fireflies just spelled out Y-E-S in golden light. Take the hint, love."},
  {i:'💐',m:"Even the rose in his hand wilted a little just now. Your YES can revive it."},
  {i:'🌙',m:"The moon asked me personally to deliver this message: one. more. chance."},
  {i:'🐼',m:"The panda is NOT sleeping tonight until you click the correct button. He means it."},
  {i:'💗',m:"This is the most important question ever asked under this sky. Make it count."},
  {i:'🌟',m:"Psst… the YES button is glowing brighter each time. It literally has your name on it. 🌸"}
];

function noRun(){
  nc++;
  const d=msgs[Math.min(nc-1,msgs.length-1)];
  showPopup(d.i,d.m);
  const m=80,maxX=innerWidth-noBtn.offsetWidth-m,maxY=innerHeight-noBtn.offsetHeight-m;
  noBtn.style.right='auto';noBtn.style.bottom='auto';
  noBtn.style.left=(m+Math.random()*maxX)+'px';
  noBtn.style.top =(m+Math.random()*maxY)+'px';
  const s=Math.min(1+nc*.07,1.72);
  document.getElementById('yes-btn').style.transform=`scale(${s})`;
}

/* ══ POPUP ══ */
function showPopup(icon,msg){
  document.getElementById('p-icon').textContent=icon;
  document.getElementById('p-msg').textContent=msg;
  document.getElementById('popup').classList.add('open');
}
function closePopup(){document.getElementById('popup').classList.remove('open')}
document.getElementById('popup').addEventListener('click',function(e){if(e.target===this)closePopup()});

/* ══ YES ══ */
function handleYes(){
  burst(88);
  setTimeout(()=>{
    document.getElementById('night-scene').classList.add('fade');
    document.getElementById('yes-scene').classList.add('visible');
    morePetals();
    document.getElementById('yes-card').classList.add('show');
    document.getElementById('content').classList.add('gone');
  },700);
}
function burst(n){
  const cols=['#ff88b8','#ffcc44','#c8aaff','#80ccff','#a0ffb8','#ffb0d0','#ffd4aa','#ff99cc'];
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const s=document.createElement('div');s.className='spark';
      const col=cols[Math.floor(Math.random()*cols.length)],sz=5+Math.random()*10;
      const a=Math.random()*Math.PI*2,d=110+Math.random()*300;
      s.style.cssText=`width:${sz}px;height:${sz}px;left:${20+Math.random()*60}vw;top:${30+Math.random()*40}vh;background:${col};box-shadow:0 0 9px 5px ${col}88;--sx:${Math.cos(a)*d}px;--sy:${Math.sin(a)*d}px;animation-duration:${1.1+Math.random()*1.1}s`;
      document.body.appendChild(s);setTimeout(()=>s.remove(),2800);
    },i*20);
  }
}
function morePetals(){
  const c=document.getElementById('petals'),cols=['#ff90b0','#ffb8d0','#ffaacc','#ff80aa','#ffd4e8'];
  for(let i=0;i<24;i++){
    const p=document.createElement('div');p.className='petal';
    const col=cols[i%cols.length],sz=13+Math.random()*20;
    p.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz*1.45}px;background:${col};border-radius:50% 8% 50% 8%;animation-duration:${7+Math.random()*9}s;animation-delay:${Math.random()*-8}s`;
    c.appendChild(p);
  }
}

/* ══ MUSIC ══ */
let playing=false;const bgm=document.getElementById('bgm'),mb=document.getElementById('mbtn');
function tryPlay(){bgm.play().then(()=>{playing=true;mb.textContent='🔇'}).catch(()=>{})}
function toggleMusic(){if(playing){bgm.pause();mb.textContent='🎵';playing=false}else tryPlay()}
tryPlay();
document.addEventListener('pointerdown',()=>{if(!playing)tryPlay()},{once:true});
</script>
</body>
