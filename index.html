<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be the love of my life? 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #08051a;
    font-family: 'Nunito', sans-serif;
    user-select: none;
  }

  /* ── Starfield canvas ── */
  #starfield {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0;
  }

  /* ── Scene SVG ── */
  #scene {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  /* ── Fireflies ── */
  .firefly {
    position: fixed;
    width: 5px; height: 5px;
    border-radius: 50%;
    pointer-events: none; z-index: 3;
    animation: ffloat ease-in-out infinite;
  }
  @keyframes ffloat {
    0%,100% { transform:translate(0,0); opacity:0; }
    15%      { opacity:1; }
    50%      { transform:translate(var(--dx),var(--dy)); opacity:.9; }
    85%      { opacity:.7; }
  }

  /* ── Petals ── */
  .petal {
    position: fixed;
    pointer-events: none; z-index: 3;
    animation: petalFall linear infinite;
    opacity: 0;
  }
  @keyframes petalFall {
    0%   { transform:translateY(-30px) rotate(0deg) translateX(0); opacity:0; }
    8%   { opacity:.85; }
    88%  { opacity:.6; }
    100% { transform:translateY(105vh) rotate(640deg) translateX(40px); opacity:0; }
  }

  /* ── Content overlay ── */
  #content {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 6vh;
    pointer-events: none;
  }

  .glass-card {
    pointer-events: all;
    background: rgba(10,6,30,0.55);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(255,220,255,0.18);
    border-radius: 28px;
    padding: 2.2rem 3rem 2rem;
    text-align: center;
    max-width: 500px; width: 92%;
    box-shadow:
      0 0 60px rgba(180,100,220,0.12),
      0 12px 48px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .panda-icon {
    font-size: 2.6rem;
    display: block;
    margin-bottom: .4rem;
    animation: gentleBob 3s ease-in-out infinite;
  }
  @keyframes gentleBob {
    0%,100%{ transform:translateY(0) rotate(-3deg); }
    50%    { transform:translateY(-8px) rotate(3deg); }
  }

  .question {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-size: clamp(1.5rem, 3.5vw, 2.1rem);
    color: #ffeef8;
    line-height: 1.35;
    margin-bottom: .5rem;
    text-shadow: 0 2px 20px rgba(200,100,200,0.4);
    letter-spacing: .01em;
  }

  .tagline {
    font-size: .78rem;
    color: rgba(255,220,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 1.8rem;
  }

  .btns {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    align-items: center;
  }

  #yes-btn {
    background: linear-gradient(135deg, #d94f8a 0%, #e8709e 50%, #f590b8 100%);
    color: #fff;
    border: none;
    padding: .85rem 2.6rem;
    border-radius: 50px;
    font-size: 1.05rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: .05em;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 4px 24px rgba(220,80,140,0.5);
    transform-origin: center;
  }
  #yes-btn:hover {
    transform: scale(1.09) translateY(-2px);
    box-shadow: 0 8px 32px rgba(220,80,140,0.65);
  }
  #yes-btn:active { transform: scale(.97); }

  #no-btn {
    position: fixed;
    background: transparent;
    color: rgba(255,220,255,0.55);
    border: 1px solid rgba(255,220,255,0.25);
    padding: .85rem 2rem;
    border-radius: 50px;
    font-size: 1.05rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .04em;
    transition: color .15s, border-color .15s;
    z-index: 15;
    /* initial pos set via JS after load */
  }
  #no-btn:hover { color: rgba(255,220,255,.3); border-color: rgba(255,220,255,.15); }

  /* ── Toast ── */
  #toast {
    position: fixed;
    top: 22px; left: 50%;
    transform: translateX(-50%);
    background: rgba(10,6,30,.75);
    backdrop-filter: blur(10px);
    color: #ffd8f0;
    padding: .55rem 1.6rem;
    border-radius: 50px;
    font-size: .88rem;
    border: 1px solid rgba(255,180,230,.2);
    opacity: 0;
    transition: opacity .3s;
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ── Music button ── */
  #music-btn {
    position: fixed;
    bottom: 22px; right: 22px;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: rgba(10,6,30,.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,200,240,.2);
    color: #ffd8f0;
    font-size: 1.2rem;
    cursor: pointer;
    z-index: 100;
    transition: background .2s, transform .15s;
    display: flex; align-items: center; justify-content: center;
  }
  #music-btn:hover { background: rgba(30,15,60,.8); transform: scale(1.08); }

  /* ── Yes overlay ── */
  #yes-page {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(8,5,26,.92);
    align-items: center; justify-content: center;
    flex-direction: column; text-align: center;
    gap: .6rem;
  }
  #yes-page.show { display: flex; }

  .yes-icon {
    font-size: 5rem;
    animation: heartPop .6s cubic-bezier(.36,.07,.19,.97) infinite alternate;
    display: block;
  }
  @keyframes heartPop {
    from { transform: scale(1) rotate(-5deg); }
    to   { transform: scale(1.15) rotate(5deg); }
  }
  .yes-headline {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-size: clamp(2rem,5vw,3.2rem);
    color: #ffd0e8;
    text-shadow: 0 0 40px rgba(255,120,180,.5);
    animation: fadeUp 1s ease both;
  }
  .yes-sub {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-size: 1.2rem;
    color: rgba(255,200,230,.55);
    animation: fadeUp 1.3s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* ── Spark particles on Yes ── */
  .spark {
    position: fixed;
    pointer-events: none;
    z-index: 150;
    border-radius: 50%;
    animation: sparkUp 1.8s ease forwards;
  }
  @keyframes sparkUp {
    0%   { opacity:1; transform:translate(0,0) scale(1); }
    100% { opacity:0; transform:translate(var(--sx),var(--sy)) scale(.2); }
  }

  <source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg">
</audio>

<button id="music-btn" title="Toggle music" onclick="toggleMusic()">🎵</button>

<script>
/* ──────────────────── STARFIELD ──────────────────── */
const cvs = document.getElementById('starfield');
const ctx = cvs.getContext('2d');
let stars = [];

function resize() {
  cvs.width  = window.innerWidth;
  cvs.height = window.innerHeight;
}

function makeStars() {
  stars = [];
  for (let i = 0; i < 260; i++) {
    stars.push({
      x: Math.random() * cvs.width,
      y: Math.random() * cvs.height * .72,
      r: Math.random() * 1.6 + .3,
      a: Math.random() * .85 + .15,
      spd: Math.random() * .009 + .002,
      ph: Math.random() * Math.PI * 2
    });
  }
}

function drawStars(t) {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  for (const s of stars) {
    const a = s.a * (.65 + .35 * Math.sin(t * s.spd + s.ph));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,248,220,${a.toFixed(2)})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}

resize(); makeStars();
window.addEventListener('resize', () => { resize(); makeStars(); });
requestAnimationFrame(drawStars);

/* ──────────────────── FIREFLIES ──────────────────── */
(function spawnFireflies() {
  const con = document.getElementById('flies');
  const cols = ['#ffe08a','#c8ffc8','#ffc8ff','#c8e8ff','#ffe8c8'];
  for (let i = 0; i < 30; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    const col = cols[i % cols.length];
    f.style.cssText = `
      left:${Math.random()*100}vw;
      top:${28+Math.random()*58}vh;
      background:${col};
      box-shadow:0 0 7px 4px ${col}88;
      --dx:${(Math.random()-.5)*140}px;
      --dy:${(Math.random()-.5)*90}px;
      animation-duration:${3+Math.random()*6}s;
      animation-delay:${Math.random()*-10}s;
    `;
    con.appendChild(f);
  }
})();

/* ──────────────────── PETALS ──────────────────── */
(function spawnPetals() {
  const con = document.getElementById('petals');
  // Use SVG petal shapes so no emoji needed
  const svgPetal = (col) => {
    const s = encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
        <ellipse cx="10" cy="5" rx="4" ry="7" fill="${col}" transform="rotate(0 10 10)"/>
        <ellipse cx="15" cy="10" rx="4" ry="7" fill="${col}" transform="rotate(72 10 10)"/>
        <ellipse cx="13" cy="17" rx="4" ry="7" fill="${col}" transform="rotate(144 10 10)"/>
        <ellipse cx="7"  cy="17" rx="4" ry="7" fill="${col}" transform="rotate(216 10 10)"/>
        <ellipse cx="5"  cy="10" rx="4" ry="7" fill="${col}" transform="rotate(288 10 10)"/>
      </svg>`
    );
    return `url("data:image/svg+xml,${s}")`;
  };

  const petalColors = ['#ffb8d0','#ffcce0','#ff99bb','#ffd6e8','#e8b0ff','#b0d8ff'];
  for (let i = 0; i < 24; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const col = petalColors[i % petalColors.length];
    const sz  = 10 + Math.random() * 16;
    p.style.cssText = `
      left:${Math.random()*105}vw;
      width:${sz}px; height:${sz}px;
      background-image:${svgPetal(col)};
      background-size:contain; background-repeat:no-repeat;
      animation-duration:${9+Math.random()*14}s;
      animation-delay:${Math.random()*-22}s;
    `;
    con.appendChild(p);
  }
})();

/* ──────────────────── NO BUTTON ──────────────────── */
const noBtn = document.getElementById('no-btn');
let noHits = 0;

// Place no button initially roughly to the right of yes
noBtn.style.left = 'auto';
noBtn.style.top  = 'auto';
noBtn.style.right  = '14vw';
noBtn.style.bottom = '12vh';

const taunts = [
  'Nuh-uh! 🙈','Too slow~ 💨','Come onnnn 🥺',
  'Try again! ✨','Almost… 🐼','Hehe 🌸',
  'The correct answer is Yes 💕','Psst— click Yes! 🌺',
  'You know you want to 💗','Okay but what if… Yes? 🥰'
];

function runAway() {
  noHits++;
  const margin = 70;
  const maxX = window.innerWidth  - noBtn.offsetWidth  - margin;
  const maxY = window.innerHeight - noBtn.offsetHeight - margin;
  noBtn.style.right  = 'auto';
  noBtn.style.bottom = 'auto';
  noBtn.style.left = (margin + Math.random() * maxX) + 'px';
  noBtn.style.top  = (margin + Math.random() * maxY) + 'px';
  showToast(taunts[Math.min(noHits - 1, taunts.length - 1)]);
  // Grow yes button
  const s = Math.min(1 + noHits * 0.06, 1.55);
  document.getElementById('yes-btn').style.transform = `scale(${s})`;
}

/* ──────────────────── TOAST ──────────────────── */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = '0', 2200);
}

/* ──────────────────── YES HANDLER ──────────────────── */
function handleYes() {
  spawnSparks();
  setTimeout(() => document.getElementById('yes-page').classList.add('show'), 900);
}

function spawnSparks() {
  const colors = ['#ff80b0','#ffcc44','#c8aaff','#80ccff','#a0ffb8','#ffb0cc'];
  for (let i = 0; i < 55; i++) {
    setTimeout(() => {
      const s = document.createElement('div');
      s.className = 'spark';
      const sz = 4 + Math.random() * 8;
      const col = colors[Math.floor(Math.random() * colors.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist  = 80 + Math.random() * 240;
      s.style.cssText = `
        width:${sz}px; height:${sz}px;
        left:${30+Math.random()*40}vw;
        top:${40+Math.random()*30}vh;
        background:${col};
        box-shadow:0 0 6px 3px ${col}88;
        --sx:${Math.cos(angle)*dist}px;
        --sy:${Math.sin(angle)*dist}px;
        animation-duration:${1.2+Math.random()*.8}s;
      `;
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 2200);
    }, i * 28);
  }
}

/* ──────────────────── MUSIC ──────────────────── */
let playing = false;
const bgm    = document.getElementById('bgm');
const musBtn = document.getElementById('music-btn');

function toggleMusic() {
  if (playing) {
    bgm.pause();
    musBtn.textContent = '🎵';
    playing = false;
  } else {
    bgm.play().catch(() => {});
    musBtn.textContent = '🔇';
    playing = true;
  }
}

// Auto-start on first interaction
document.addEventListener('pointerdown', () => {
  if (!playing) {
    bgm.play().then(() => {
      playing = true;
      musBtn.textContent = '🔇';
    }).catch(() => {});
  }
}, { once: true });
</script>
